# Dependabot opens pull requests when pinned versions have updates or security fixes.
# Each PR runs the full CI before anything is merged.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-tools:
        patterns: ["pytest*", "ruff"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      frontend-tooling:
        patterns: ["eslint*", "@eslint/*", "typescript*", "vite*", "@vitejs/*", "vitest", "@testing-library/*", "jsdom", "@types/*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
