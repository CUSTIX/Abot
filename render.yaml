# Render Blueprint for the live demo. Render builds the Dockerfile's last stage (`prod`: React
# build + Django) and runs bin/start.sh. The database is external (Neon free Postgres): paste its
# connection string as DATABASE_URL when Render asks. Nothing secret lives in this file.
# See docs/deploy.md.
services:
  - type: web
    name: abot-ph # abot.onrender.com is taken
    runtime: docker
    plan: free
    region: singapore
    # Deploy only when CI passes. Every deploy also reseeds the demo.
    autoDeployTrigger: checksPass
    # /livez/ answers without the database, so the free Neon database can still suspend.
    healthCheckPath: /livez/
    envVars:
      - key: DATABASE_URL
        sync: false # prompted in the dashboard, never committed
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_HTTPS
        value: "true"
      - key: DJANGO_STATIC_MANIFEST
        value: "true"
      - key: DJANGO_TIME_ZONE
        value: Asia/Manila
      - key: DEMO_MODE
        value: "true"
      - key: DEMO_RESET_ON_START
        value: "true"
      - key: DEMO_RESET_HOUR
        value: "4" # nightly reset at 4 AM Manila (the service is kept awake)
      - key: DEMO_PASSWORD
        value: abot-demo
      - key: CLIENT_IP_HEADER
        value: HTTP_CF_CONNECTING_IP # Cloudflare (in front of Render) overwrites this header
      - key: WEB_CONCURRENCY
        value: "2" # free instance has 512 MB of RAM
